name: Add-on container build

on:
  push:
    branches:
      - main
    paths:
      - "ha-nilm-detector/**"
      - ".github/workflows/docker.yml"
  pull_request:
    paths:
      - "ha-nilm-detector/**"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build add-on image
        uses: docker/build-push-action@v6
        with:
          context: ./ha-nilm-detector
          file: ./ha-nilm-detector/Dockerfile
          load: true
          tags: ha-nilm-addon:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_FROM=alpine:3.20

      - name: Smoke-test Python runtime
        run: |
          docker run --rm --entrypoint python3 ha-nilm-addon:test -c "import numpy, scipy, sklearn, requests, paho.mqtt.client; import app.main; print('runtime imports ok')"

      - name: Verify release version is embedded
        run: |
          docker run --rm --entrypoint python3 ha-nilm-addon:test -c "from app.version import get_app_version; version=get_app_version(); print('version=' + version); assert version != 'dev'"

      - name: Verify add-on entrypoint
        run: |
          docker run --rm --entrypoint /bin/sh ha-nilm-addon:test -c "test -x /run.sh && test -f /app/main.py && test -f /app/config.yaml && echo 'entrypoint files ok'"
