name: Python tests

on:
  push:
    branches:
      - main
    paths:
      - "**/*.py"
      - "requirements.txt"
      - "ha-nilm-detector/requirements.txt"
      - ".github/workflows/python-app.yml"
  pull_request:
    paths:
      - "**/*.py"
      - "requirements.txt"
      - "ha-nilm-detector/requirements.txt"
      - ".github/workflows/python-app.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest flake8 scipy

      - name: Check syntax and hard failures
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run test suite
        run: |
          pytest -q
